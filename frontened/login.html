<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="grid-container">
            <div class="illustration-panel">
                <h1>Manage <br>your life</h1>
            </div>
            <div class="login-panel">
                <header class="header-login">
                <div class="sidebar-logo">
                    <a href="#top"><span>S</span> Study Flow</a>
                </div>
                    <div class="sign-up">
                        <i class="fa-solid fa-circle-user"></i>
                        <p class="p-link">Sign Up</p>
                    </div>
                </header>
                <section class="sign-in-section">
                    <h1>Sign In</h1>
                    <div class="prompt">
                        <input type="email" id="email-prompt" placeholder="Email or Username">
                    </div>
                    <div class="prompt">
                        <input type="password" id="password-prompt" placeholder="Password">
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                    <p>Forgot Password?</p>
                    <div class="signin-button">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <button onclick="window.location.href='index.html'">Sign In</button>
                    </div>
                </section>
                <footer class="footer-login">
                    <p>2025 Study Flow</p>
                    <div class="footer-login-end">
                        <p class="p-link">Contact Us</p>
                        <div class="language-login">
                            <p>English</p>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>
</body>
</html>
