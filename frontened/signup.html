<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Study Flow</title>

    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="grid-container">
            <div class="illustration-panel">
                <h1>Make room<br>to grow</h1>
            </div>
            <div class="login-panel">
                <header class="header-login">
                    <div class="sidebar-logo">
                        <a href="index.html"><span>S</span> Study Flow</a>
                    </div>
                    <a class="sign-up" href="login.html">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <p class="p-link">Sign In</p>
                    </a>
                </header>
                <form class="sign-in-section" action="#" method="post">
                    <h1>Create Account</h1>
                    <div class="prompt">
                        <input type="text" name="name" placeholder="Full name" aria-label="Full name" autocomplete="name" required>
                    </div>
                    <div class="prompt">
                        <input type="email" name="email" placeholder="Email address" aria-label="Email address" autocomplete="email" required>
                    </div>
                    <div class="prompt">
                        <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="prompt">
                        <input type="password" name="password_confirmation" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="signin-button">
                        <i class="fa-solid fa-user-plus"></i>
                        <button type="submit">Create Account</button>
                    </div>
                </form>
                <footer class="footer-login">
                    <p>2025 Study Flow</p>
                    <div class="footer-login-end">
                        <p class="p-link">Contact Us</p>
                        <div class="language-login">
                            <p>English</p>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>
</body>
</html>
