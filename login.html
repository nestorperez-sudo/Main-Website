<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css ">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="grid-container">
            <div class="illustration-panel">
                <h1>Manage <br>your life</h1>
            </div>
            <div class="login-panel">
                <header class="header-login">
                    <a class="logo" href="#top"><span>S</span> StudyFlow</a>
                    <div class="sign-up">
                        <i class="fa-solid fa-circle-user"></i>
                        <p>Sign Up</p>
                    </div>
                </header>
                <section class="sign-in-section">
                    <h1>Sign In</h1>
                    <div class="prompt">
                        <input type="email" id="email-prompt" placeholder="Email or Username">
                    </div>
                    <div class="prompt">
                        <input type="password" id="password-prompt" placeholder="Password">
                        <i class="fa-regular fa-eye-slash"></i>
                    </div>
                    <p>Forgot Password?</p>
                    <div class="signin-button">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <p>Sign In</p>
                    </div>
                </section>
                <footer class="footer-login">
                    <p>2025 Study Flow Inc.</p>
                    <div class="footer-login-end">
                        <p>Contact Us</p>
                        <div class="language-login">
                            <p>English</p>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
    </div>
</body>
</html>
