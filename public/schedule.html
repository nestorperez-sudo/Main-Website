<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule | Study Flow</title>

    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/schedule.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="page">
        <aside id="sidebar" class="aside">
            <nav aria-label="Main navigation">
                <div class="sidebar-logo">
                    <a href="index.html"><span>S</span> Study Flow</a>
                    <button type="button" class="sidebar-toggle" id="arrow-collapse" aria-label="Collapse sidebar" aria-expanded="true" onclick="toggleSidebar(this)">
                        <i class="fa-solid fa-angles-right" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="workspace">Workspace</div>
                <a class="navigation" href="index.html">
                    <i class="fa-solid fa-clock" aria-hidden="true"></i>
                    <span>Today</span>
                </a>
                <a class="navigation active" href="schedule.html" aria-current="page">
                    <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                    <span>Schedule</span>
                </a>
                <a class="navigation" href="tasks.html">
                    <i class="fa-solid fa-list-check" aria-hidden="true"></i>
                    <span>Tasks</span>
                </a>
                <a class="navigation" href="courses.html">
                    <i class="fa-solid fa-book" aria-hidden="true"></i>
                    <span>Courses</span>
                </a>
                <a class="navigation" href="statistics.html">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                    <span>Statistics</span>
                </a>
            </nav>
            <footer>
                <a href="login.html">Want to log out?</a>
                <small>Student Account</small>
            </footer>
        </aside>

        <div class="content" id="top">
            <header>
                <p class="current-date">Thursday, 1 October</p>
                <div class="header-right-side">
                    <form role="search">
                        <div class="search-bar">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <input class="search-bar-input" type="search" placeholder="Search tasks, courses..." aria-label="Search tasks and courses">
                        </div>
                    </form>
                    <div class="notification-control">
                        <button type="button" id="notification-toggle" class="alert-row" aria-label="Notifications, 3 unread" aria-expanded="false" aria-controls="notifications-panel">
                            <i class="fa-regular fa-bell" aria-hidden="true"></i>
                            <span class="red-circle-alert" aria-hidden="true">3</span>
                        </button>
                    </div>
                    <a class="profile-picture" href="settings.html" aria-label="Profile settings">AL</a>
                </div>
            </header>

            <main class="schedule-main">
                <div class="schedule-heading">
                    <div>
                        <h1>Schedule</h1>
                        <p>See your month at a glance and what’s on today.</p>
                    </div>
                    <button type="button" class="courses-add-button" id="add-event-button"><i class="fa-solid fa-plus" aria-hidden="true"></i>Add event</button>
                </div>
                <p class="list-status" id="schedule-status" role="status" hidden></p>
                <div class="schedule-layout">
                    <section class="card month-card" aria-labelledby="month-title">
                        <div class="card-header">
                            <h2 class="card-title" id="month-title"></h2>
                            <span class="count">Monthly calendar</span>
                        </div>
                        <div class="month-calendar" role="group" aria-labelledby="month-title">
                            <div class="month-weekdays" aria-hidden="true">
                                <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                            </div>
                            <ol class="month-days" id="month-days"></ol>
                        </div>
                        <div class="calendar-key">
                            <span><i class="selected-key" aria-hidden="true"></i>Selected day</span>
                            <span><i class="event-key" aria-hidden="true"></i>Has events</span>
                        </div>
                    </section>
                    <section class="card day-agenda" aria-labelledby="agenda-title">
                        <div class="card-header">
                            <div>
                                <h2 class="card-title" id="agenda-title">Your schedule</h2>
                                <p class="agenda-date" id="agenda-date"></p>
                            </div>
                            <div class="schedule-view-switch" role="group" aria-label="Schedule view">
                                <button class="schedule-view-button" type="button" aria-pressed="true" aria-controls="weekly-agenda" data-schedule-view="weekly">Weekly</button>
                                <button class="schedule-view-button" type="button" aria-pressed="false" aria-controls="daily-agenda" data-schedule-view="daily">Daily</button>
                            </div>
                        </div>
                        <div class="agenda-view" id="weekly-agenda" aria-live="polite"></div>
                        <div class="agenda-view" id="daily-agenda" hidden>
                            <h3 class="daily-agenda-heading" id="daily-agenda-heading"></h3>
                            <ol class="agenda-list" id="daily-agenda-list" aria-live="polite"></ol>
                        </div>
                    </section>
                </div>

                <dialog class="course-detail-dialog" id="event-form-dialog" aria-labelledby="event-form-title">
                    <form class="course-detail-content entity-form" id="event-form" novalidate>
                        <div class="course-detail-header">
                            <h2 id="event-form-title">Add an event</h2>
                            <button class="course-detail-close" type="button" data-close-dialog aria-label="Close event form">×</button>
                        </div>
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="event-title">Title</label>
                                <input id="event-title" name="title" type="text" required maxlength="80" placeholder="Calculus II lecture">
                                <p class="field-error" data-error-for="title"></p>
                            </div>
                            <div class="form-field">
                                <label for="event-type">Type</label>
                                <select id="event-type" name="type" required>
                                    <option value="class">Class</option>
                                    <option value="study">Study</option>
                                    <option value="exam">Exam</option>
                                    <option value="deadline">Deadline</option>
                                </select>
                                <p class="field-error" data-error-for="type"></p>
                            </div>
                            <div class="form-field">
                                <label for="event-date">Date</label>
                                <input id="event-date" name="date" type="date" required>
                                <p class="field-error" data-error-for="date"></p>
                            </div>
                            <div class="form-field">
                                <label for="event-course">Course <span>(optional)</span></label>
                                <select id="event-course" name="courseId">
                                    <option value="">No course</option>
                                </select>
                                <p class="field-error" data-error-for="courseId"></p>
                            </div>
                            <div class="form-field">
                                <label for="event-start">Starts</label>
                                <input id="event-start" name="startTime" type="time" required>
                                <p class="field-error" data-error-for="startTime"></p>
                            </div>
                            <div class="form-field">
                                <label for="event-end">Ends <span>(optional)</span></label>
                                <input id="event-end" name="endTime" type="time">
                                <p class="field-error" data-error-for="endTime"></p>
                            </div>
                            <div class="form-field">
                                <label for="event-location">Location <span>(optional)</span></label>
                                <input id="event-location" name="location" type="text" maxlength="80" placeholder="Room 204">
                                <p class="field-error" data-error-for="location"></p>
                            </div>
                        </div>
                        <p class="form-error" role="alert"></p>
                        <div class="popup-btns">
                            <button type="button" class="reset-btn" data-close-dialog>Cancel</button>
                            <button type="submit">Save event</button>
                        </div>
                    </form>
                </dialog>
            </main>
        </div>
    </div>
</body>
</html>
