<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | Study Flow</title>

    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/courses.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="page">
        <aside id="sidebar" class="aside">
            <nav aria-label="Main navigation">
                <div class="sidebar-logo">
                    <a href="index.html"><span>S</span> Study Flow</a>
                    <button type="button" class="sidebar-toggle" id="arrow-collapse" aria-label="Collapse sidebar" aria-expanded="true" onclick="toggleSidebar(this)">
                        <i class="fa-solid fa-angles-right" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="workspace">Workspace</div>
                <a class="navigation" href="index.html">
                    <i class="fa-solid fa-clock" aria-hidden="true"></i>
                    <span>Today</span>
                </a>
                <a class="navigation" href="schedule.html">
                    <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                    <span>Schedule</span>
                </a>
                <a class="navigation" href="tasks.html">
                    <i class="fa-solid fa-list-check" aria-hidden="true"></i>
                    <span>Tasks</span>
                </a>
                <a class="navigation active" href="courses.html" aria-current="page">
                    <i class="fa-solid fa-book" aria-hidden="true"></i>
                    <span>Courses</span>
                </a>
                <a class="navigation" href="statistics.html">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                    <span>Statistics</span>
                </a>
            </nav>
            <footer>
                <a href="login.html">Want to log out?</a>
                <small>Student Account</small>
            </footer>
        </aside>

        <div class="content" id="top">
            <header>
                <p class="current-date">Thursday, 21 October</p>
                <div class="header-right-side">
                    <form role="search">
                        <div class="search-bar">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <input class="search-bar-input" type="search" placeholder="Search tasks, courses..." aria-label="Search tasks and courses">
                        </div>
                    </form>
                    <div class="notification-control">
                        <button type="button" id="notification-toggle" class="alert-row" aria-label="Notifications, 3 unread" aria-expanded="false" aria-controls="notifications-panel">
                            <i class="fa-regular fa-bell" aria-hidden="true"></i>
                            <span class="red-circle-alert" aria-hidden="true">3</span>
                        </button>
                    </div>
                    <a class="profile-picture" href="settings.html" aria-label="Profile settings">AL</a>
                </div>
            </header>

            <main class="courses-main">
                <div class="courses-heading">
                    <div>
                        <h1>Courses</h1>
                        <p id="courses-summary">Loading summary…</p>
                    </div>
                    <div class="courses-actions">
                        <div class="semester-tabs" role="group" aria-label="Show courses">
                            <button type="button" data-archived="false" aria-pressed="true">Active</button>
                            <button type="button" data-archived="true" aria-pressed="false">Archived</button>
                        </div>
                        <button type="button" class="courses-add-button" id="add-course-button"><i class="fa-solid fa-plus" aria-hidden="true"></i>Add course</button>
                    </div>
                </div>

                <form class="courses-filters" id="courses-filters" role="search">
                    <div class="filter-field filter-search">
                        <label for="course-search">Search</label>
                        <input type="search" id="course-search" name="search" placeholder="Course name or code" maxlength="60" autocomplete="off">
                    </div>
                    <div class="filter-field">
                        <label for="course-semester-filter">Semester</label>
                        <select id="course-semester-filter" name="semester">
                            <option value="">All semesters</option>
                            <option value="fall-2026">Fall 2026</option>
                            <option value="spring-2027">Spring 2027</option>
                        </select>
                    </div>
                    <button type="submit" class="filter-button">Search</button>
                </form>

                <p class="list-status" id="courses-status" role="status" hidden></p>

                <section class="course-grid" id="courses" aria-label="Courses" aria-live="polite">
                    <button type="button" class="card add-course-card" id="add-course">
                        <span class="add-course-icon"><i class="fa-solid fa-plus" aria-hidden="true"></i></span>
                        <span class="add-course-title">Add a course</span>
                        <span class="add-course-text">Name it, pick a colour, and add its class times.</span>
                    </button>
                </section>

                <dialog class="course-detail-dialog" id="course-form-dialog" aria-labelledby="course-form-title">
                    <form class="course-detail-content entity-form" id="course-form" novalidate>
                        <div class="course-detail-header">
                            <h2 id="course-form-title">Add a course</h2>
                            <button class="course-detail-close" type="button" data-close-dialog aria-label="Close course form">×</button>
                        </div>
                        <div class="form-grid">
                            <div class="form-field">
                                <label for="course-code">Code</label>
                                <input id="course-code" name="code" type="text" required minlength="3" maxlength="10" pattern="[A-Za-z0-9\-]+" placeholder="MAT-201">
                                <p class="field-error" data-error-for="code"></p>
                            </div>
                            <div class="form-field">
                                <label for="course-name">Name</label>
                                <input id="course-name" name="name" type="text" required maxlength="60" placeholder="Calculus II">
                                <p class="field-error" data-error-for="name"></p>
                            </div>
                            <div class="form-field">
                                <label for="course-instructor">Instructor</label>
                                <input id="course-instructor" name="instructor" type="text" required maxlength="60" placeholder="Prof. Elena Marín">
                                <p class="field-error" data-error-for="instructor"></p>
                            </div>
                            <div class="form-field">
                                <label for="course-meeting-times">Class times <span>(optional)</span></label>
                                <input id="course-meeting-times" name="meetingTimes" type="text" maxlength="80" placeholder="Mon and Wed, 9:00 to 11:00">
                                <p class="field-error" data-error-for="meetingTimes"></p>
                            </div>
                            <div class="form-field">
                                <label for="course-credits">Credits</label>
                                <input id="course-credits" name="credits" type="number" required min="1" max="12" step="1" value="6">
                                <p class="field-error" data-error-for="credits"></p>
                            </div>
                            <div class="form-field">
                                <label for="course-semester">Semester</label>
                                <select id="course-semester" name="semester" required>
                                    <option value="fall-2026">Fall 2026</option>
                                    <option value="spring-2027">Spring 2027</option>
                                </select>
                                <p class="field-error" data-error-for="semester"></p>
                            </div>
                            <div class="form-field">
                                <label for="course-color">Colour</label>
                                <select id="course-color" name="color" required>
                                    <option value="blue">Blue</option>
                                    <option value="green">Green</option>
                                    <option value="red">Red</option>
                                    <option value="violet">Violet</option>
                                </select>
                                <p class="field-error" data-error-for="color"></p>
                            </div>
                            <div class="form-field form-check">
                                <input id="course-archived" name="archived" type="checkbox">
                                <label for="course-archived">Archived</label>
                                <p class="field-error" data-error-for="archived"></p>
                            </div>
                        </div>
                        <p class="form-error" role="alert"></p>
                        <div class="popup-btns">
                            <button type="button" class="reset-btn" data-close-dialog>Cancel</button>
                            <button type="submit">Save course</button>
                        </div>
                    </form>
                </dialog>

                <dialog class="course-detail-dialog" id="course-detail-dialog" aria-labelledby="course-detail-title">
                    <div class="course-detail-content">
                        <div class="course-detail-header">
                            <div>
                                <span class="course-code" id="course-detail-code"></span>
                                <h2 id="course-detail-title"></h2>
                            </div>
                            <button class="course-detail-close" type="button" data-close-dialog aria-label="Close course details">×</button>
                        </div>
                        <p class="course-detail-instructor" id="course-detail-instructor"></p>
                        <p class="course-detail-meeting" id="course-detail-meeting"></p>
                        <div id="course-detail-summary"></div>

                        <h3>Grades</h3>
                        <p class="list-status" id="grades-status" role="status" hidden></p>
                        <ul class="entry-list" id="course-detail-grades" aria-live="polite"></ul>
                        <form class="inline-form entity-form" id="grade-form" novalidate>
                            <h4 id="grade-form-title">Add a grade</h4>
                            <div class="form-grid">
                                <div class="form-field">
                                    <label for="grade-title">Title</label>
                                    <input id="grade-title" name="title" type="text" required maxlength="80" placeholder="Midterm">
                                    <p class="field-error" data-error-for="title"></p>
                                </div>
                                <div class="form-field">
                                    <label for="grade-type">Type</label>
                                    <select id="grade-type" name="type" required>
                                        <option value="exam">Exam</option>
                                        <option value="assignment">Assignment</option>
                                        <option value="project">Project</option>
                                        <option value="quiz">Quiz</option>
                                    </select>
                                    <p class="field-error" data-error-for="type"></p>
                                </div>
                                <div class="form-field">
                                    <label for="grade-score">Score (%)</label>
                                    <input id="grade-score" name="score" type="number" required min="0" max="100" step="any">
                                    <p class="field-error" data-error-for="score"></p>
                                </div>
                                <div class="form-field">
                                    <label for="grade-weight">Weight (%)</label>
                                    <input id="grade-weight" name="weight" type="number" required min="0" max="100" step="any">
                                    <p class="field-error" data-error-for="weight"></p>
                                </div>
                                <div class="form-field">
                                    <label for="grade-date">Date</label>
                                    <input id="grade-date" name="date" type="date" required>
                                    <p class="field-error" data-error-for="date"></p>
                                </div>
                            </div>
                            <p class="field-error" data-error-for="courseId"></p>
                            <p class="form-error" role="alert"></p>
                            <div class="popup-btns">
                                <button type="button" class="reset-btn" id="grade-cancel-edit" hidden>Cancel edit</button>
                                <button type="submit">Save grade</button>
                            </div>
                        </form>

                        <h3>Assignments and deadlines</h3>
                        <ol class="course-assignment-list" id="course-detail-assignments"></ol>
                    </div>
                </dialog>
            </main>
        </div>
    </div>
</body>
</html>
