<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Study Flow</title>

    <link rel="stylesheet" href="styles.css">
    <script src="js/main.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/tasks.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="page">
        <aside id="sidebar" class="aside">
            <nav aria-label="Main navigation">
                <div class="sidebar-logo">
                    <a href="index.html"><span>S</span> Study Flow</a>
                    <button type="button" class="sidebar-toggle" id="arrow-collapse" aria-label="Collapse sidebar" aria-expanded="true" onclick="toggleSidebar(this)">
                        <i class="fa-solid fa-angles-right" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="workspace">Workspace</div>
                <a class="navigation" href="index.html">
                    <i class="fa-solid fa-clock" aria-hidden="true"></i>
                    <span>Today</span>
                </a>
                <a class="navigation" href="schedule.html">
                    <i class="fa-regular fa-calendar-days" aria-hidden="true"></i>
                    <span>Schedule</span>
                </a>
                <a class="navigation active" href="tasks.html" aria-current="page">
                    <i class="fa-solid fa-list-check" aria-hidden="true"></i>
                    <span>Tasks</span>
                </a>
                <a class="navigation" href="courses.html">
                    <i class="fa-solid fa-book" aria-hidden="true"></i>
                    <span>Courses</span>
                </a>
                <a class="navigation" href="statistics.html">
                    <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                    <span>Statistics</span>
                </a>
            </nav>
            <footer>
                <a href="login.html">Want to log out?</a>
                <small>Student Account</small>
            </footer>
        </aside>

        <div class="content" id="top">
            <header>
                <p class="current-date">Thursday, 21 October</p>
                <div class="header-right-side">
                    <form role="search">
                        <div class="search-bar">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <input class="search-bar-input" type="search" placeholder="Search tasks, courses..." aria-label="Search tasks and courses">
                        </div>
                    </form>
                    <div class="notification-control">
                        <button type="button" id="notification-toggle" class="alert-row" aria-label="Notifications, 3 unread" aria-expanded="false" aria-controls="notifications-panel">
                            <i class="fa-regular fa-bell" aria-hidden="true"></i>
                            <span class="red-circle-alert" aria-hidden="true">3</span>
                        </button>
                    </div>
                    <button type="button" class="add-task-btn" onclick="openPopup()">
                        <i class="fa-solid fa-plus" aria-hidden="true"></i>
                        <span class="add-task">Add task</span>
                    </button>
                    <a class="profile-picture" href="settings.html" aria-label="Profile settings">AL</a>
                </div>
            </header>

            <main class="tasks-main">
                <div class="tasks-heading">
                    <h1>Tasks</h1>
                    <p>A simple list of what’s coming up.</p>
                </div>

                <section class="card tasks-list-card" aria-labelledby="upcoming-tasks-title">
                    <div class="card-header">
                        <h2 class="card-title" id="upcoming-tasks-title">Upcoming</h2>
                        <div class="task-list-controls">
                            <span class="count" id="upcoming-count"></span>
                            <label for="task-sort">Sort</label>
                            <select id="task-sort" class="task-sort-select">
                                <option value="due-asc">Date (earliest first)</option>
                                <option value="due-desc">Date (latest first)</option>
                                <option value="subject-asc">Subject (A–Z)</option>
                            </select>
                        </div>
                    </div>
                    <p class="list-status" id="upcoming-status" role="status" hidden></p>
                    <ul class="task-list" id="upcoming-list" aria-live="polite"></ul>
                </section>

                <section class="card tasks-list-card completed-tasks" aria-labelledby="completed-tasks-title">
                    <div class="card-header">
                        <h2 class="card-title" id="completed-tasks-title">Completed</h2>
                        <span class="count" id="completed-count"></span>
                    </div>
                    <p class="list-status" id="completed-status" role="status" hidden></p>
                    <ul class="task-list" id="completed-list" aria-live="polite"></ul>
                </section>
            </main>
        </div>
    </div>
    <div class="add-popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="task-popup-title">
        <div class="top-popup">
            <h1 id="task-popup-title">Add a task</h1>
            <button type="button" class="task-popup-close" onclick="closePopup()" aria-label="Close add task">
                <i class="fa-solid fa-xmark x-popup" aria-hidden="true"></i>
            </button>
        </div>
        <p style="margin-bottom: 8px;">Add it to your plan so it shows up</p>
        <form class="form-popup entity-form" id="task-form" novalidate>
            <label id="task-type-label">Type</label>
            <div class="types-task" role="group" aria-labelledby="task-type-label" data-choice-group="type">
                <button type="button" data-value="assignment" aria-pressed="true">Assignment</button>
                <button type="button" data-value="exam" aria-pressed="false">Exam</button>
                <button type="button" data-value="project" aria-pressed="false">Project</button>
                <button type="button" data-value="quiz" aria-pressed="false">Quiz</button>
                <button type="button" data-value="study" aria-pressed="false">Study</button>
                <button type="button" data-value="reading" aria-pressed="false">Reading</button>
                <button type="button" data-value="personal" aria-pressed="false">Personal</button>
            </div>
            <input type="hidden" name="type" value="assignment">
            <p class="field-error" data-error-for="type"></p>

            <div class="additional-info-popup">
                <div class="popup-course">
                    <label for="task-course">Course</label>
                    <select name="courseId" id="task-course" required>
                        <option value="">Loading courses…</option>
                    </select>
                    <p class="field-error" data-error-for="courseId"></p>
                </div>
                <div>
                    <label for="task-title">Title</label>
                    <input type="text" name="title" id="task-title" placeholder="e.g. Lab report" required maxlength="100">
                    <p class="field-error" data-error-for="title"></p>
                </div>
                <div>
                    <label for="task-date">Due date</label>
                    <input type="date" name="dueDate" id="task-date" required>
                    <p class="field-error" data-error-for="dueDate"></p>
                </div>
                <div>
                    <label for="task-time">Time <span>(optional)</span></label>
                    <input type="time" name="dueTime" id="task-time">
                    <p class="field-error" data-error-for="dueTime"></p>
                </div>
            </div>

            <label id="task-priority-label" style="margin-top: 8px;">Priority</label>
            <div class="types-task" role="group" aria-labelledby="task-priority-label" data-choice-group="priority">
                <button type="button" data-value="low" aria-pressed="false" style="background-color: var(--green);">Low</button>
                <button type="button" data-value="medium" aria-pressed="true">Medium</button>
                <button type="button" data-value="high" aria-pressed="false" style="background-color: var(--gold);">High</button>
            </div>
            <input type="hidden" name="priority" value="medium">
            <p class="field-error" data-error-for="priority"></p>

            <label for="task-reminder">Remind me</label>
            <select name="reminder" id="task-reminder" required>
                <option value="none">No reminder</option>
                <option value="1-day">1 day before</option>
                <option value="3-days" selected>3 days before</option>
                <option value="1-week">1 week before</option>
            </select>
            <p class="field-error" data-error-for="reminder"></p>

            <label for="task-description" style="margin-top: 8px;">Short description <span>(Optional)</span></label>
            <input type="text" name="description" id="task-description" maxlength="500">
            <p class="field-error" data-error-for="description"></p>

            <p class="form-error" role="alert"></p>
            <div class="popup-btns" style="margin-top: 8px;">
                <button type="reset" class="reset-btn">Reset</button>
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>
</html>
